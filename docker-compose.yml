# Despliegue en un VPS con Nginx instalado en el sistema (fuera de Docker).
# La app solo escucha en 127.0.0.1 (no queda expuesta a internet); Nginx recibe
# el tráfico en 80/443, gestiona el HTTPS (certbot) y lo reenvía a este puerto.
#
# Uso:  docker compose up -d --build
# Variables en .env (ver .env.example y DEPLOY.md).

services:
  guardiaflow:
    build: .
    image: guardiaflow:latest
    container_name: guardiaflow
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
